name: Nightly Fleet Audit

on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST (UTC+5:30)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e ".[dev]"

      - name: Collect inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: dhe-cruzer69
        run: |
          python -m collectors.gh_inventory --owner dhe-cruzer69 --out data/inventory.json

      - name: Actions health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m collectors.gh_actions_health --inventory data/inventory.json || true

      - name: Commit snapshots
        run: |
          git config user.name "x4-fleet[bot]"
          git config user.email "x4-fleet[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore(fleet): nightly inventory + health snapshot"
          git push || true
