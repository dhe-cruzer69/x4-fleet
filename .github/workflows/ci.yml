name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check collectors healing || true

      - name: Type check
        run: mypy collectors --ignore-missing-imports || true

      - name: Unit tests
        run: pytest -q --tb=short

      - name: Inventory dry-run (no token)
        run: |
          python -c "from collectors.gh_inventory import summarize; print('ok')"
