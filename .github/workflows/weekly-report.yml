name: Weekly Fleet Report

on:
  schedule:
    - cron: "0 3 * * 1"   # Monday 08:30 IST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Summarize inventory
        id: summary
        run: |
          if [ -f data/inventory.json ]; then
            TOTAL=$(python -c "import json; d=json.load(open('data/inventory.json')); print(d.get('total',0))")
            STALE=$(python -c "import json; d=json.load(open('data/inventory.json')); print(d.get('stale',0))")
            EMPTY=$(python -c "import json; d=json.load(open('data/inventory.json')); print(d.get('empty_stubs',0))")
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "stale=$STALE" >> $GITHUB_OUTPUT
            echo "empty=$EMPTY" >> $GITHUB_OUTPUT
          else
            echo "total=0" >> $GITHUB_OUTPUT
            echo "stale=0" >> $GITHUB_OUTPUT
            echo "empty=0" >> $GITHUB_OUTPUT
          fi

      - name: Open or update fleet report issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Fleet Report — ${new Date().toISOString().slice(0,10)}`;
            const body = `## Weekly X4 Fleet Status\n\n- **Total repos**: ${{ steps.summary.outputs.total }}\n- **Stale (>14d)**: ${{ steps.summary.outputs.stale }}\n- **Empty stubs**: ${{ steps.summary.outputs.empty }}\n\nGenerated by \`x4-fleet\` nightly audit.\n\nSee \`data/inventory.json\` for full details.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['fleet-report']
            });
